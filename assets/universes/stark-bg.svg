<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <radialGradient id="starkBgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1c1015"/>
      <stop offset="60%" stop-color="#0a0508"/>
      <stop offset="100%" stop-color="#020204"/>
    </radialGradient>
    <pattern id="starkBgGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#FFB84D" stroke-width="0.5" opacity="0.1"/>
    </pattern>
  </defs>
  <rect width="1200" height="800" fill="url(#starkBgGrad)"/>
  <rect width="1200" height="800" fill="url(#starkBgGrid)"/>
  <!-- Holographic Stark HUD Circular Overlays -->
  <g stroke="#00C8FF" opacity="0.25" fill="none">
    <circle cx="600" cy="400" r="350" stroke-width="1.5" stroke-dasharray="10 8 30 8"/>
    <circle cx="600" cy="400" r="280" stroke-width="2" stroke-dasharray="80 30"/>
    <circle cx="600" cy="400" r="180" stroke-width="1"/>
    <line x1="100" y1="400" x2="1100" y2="400" stroke-dasharray="4 4"/>
    <line x1="600" y1="50" x2="600" y2="750" stroke-dasharray="4 4"/>
  </g>
</svg>
