<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <!-- Halftone Pattern -->
    <pattern id="spideyHalftone" x="0" y="0" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.8" fill="#FF3D6E" opacity="0.18"/>
      <circle cx="10" cy="10" r="1.5" fill="#33E6C9" opacity="0.15"/>
    </pattern>
    <linearGradient id="spiderBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a14"/>
      <stop offset="50%" stop-color="#140f28"/>
      <stop offset="100%" stop-color="#050508"/>
    </linearGradient>
    <linearGradient id="suitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2A6D"/>
      <stop offset="50%" stop-color="#B01447"/>
      <stop offset="100%" stop-color="#050D24"/>
    </linearGradient>
    <linearGradient id="webGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#33E6C9"/>
      <stop offset="100%" stop-color="#7C5CFF"/>
    </linearGradient>
    <linearGradient id="eyeGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#E2F7FF"/>
      <stop offset="100%" stop-color="#70D6FF"/>
    </linearGradient>
    <filter id="neonBloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur1"/>
      <feGaussianBlur stdDeviation="20" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="800" fill="url(#spiderBg)"/>
  <rect width="600" height="800" fill="url(#spideyHalftone)"/>

  <!-- Dimensional Web Rays & Grid -->
  <g stroke="url(#webGlow)" stroke-width="1.2" opacity="0.45" filter="url(#neonBloom)">
    <!-- Radial Web Spokes -->
    <line x1="300" y1="360" x2="0" y2="0"/>
    <line x1="300" y1="360" x2="200" y2="0"/>
    <line x1="300" y1="360" x2="400" y2="0"/>
    <line x1="300" y1="360" x2="600" y2="0"/>
    <line x1="300" y1="360" x2="600" y2="250"/>
    <line x1="300" y1="360" x2="600" y2="550"/>
    <line x1="300" y1="360" x2="600" y2="800"/>
    <line x1="300" y1="360" x2="400" y2="800"/>
    <line x1="300" y1="360" x2="200" y2="800"/>
    <line x1="300" y1="360" x2="0" y2="800"/>
    <line x1="300" y1="360" x2="0" y2="550"/>
    <line x1="300" y1="360" x2="0" y2="250"/>

    <!-- Concentric Web Spirals -->
    <path d="M 230,360 Q 300,320 370,360 Q 400,420 340,440 Q 280,450 230,410 Z" fill="none"/>
    <path d="M 170,360 Q 300,280 430,360 Q 480,480 370,510 Q 240,530 170,440 Z" fill="none"/>
    <path d="M 100,360 Q 300,220 500,360 Q 560,550 420,600 Q 200,620 100,490 Z" fill="none"/>
    <path d="M 30,360 Q 300,150 570,360 Q 640,640 460,700 Q 150,720 30,550 Z" fill="none"/>
  </g>

  <!-- Comic Glitch Shifting Silhouettes -->
  <g opacity="0.3" transform="translate(-10, -6)">
    <!-- Cyan Aberration -->
    <path d="M 300,160 C 230,160 175,230 175,340 C 175,440 235,530 300,580 C 365,530 425,440 425,340 C 425,230 370,160 300,160 Z" fill="none" stroke="#33E6C9" stroke-width="4"/>
  </g>
  <g opacity="0.3" transform="translate(10, 6)">
    <!-- Magenta Aberration -->
    <path d="M 300,160 C 230,160 175,230 175,340 C 175,440 235,530 300,580 C 365,530 425,440 425,340 C 425,230 370,160 300,160 Z" fill="none" stroke="#FF3D6E" stroke-width="4"/>
  </g>

  <!-- Mask Base & Hood Contours -->
  <path d="M 300,140 C 210,140 150,225 150,350 C 150,475 220,580 300,620 C 380,580 450,475 450,350 C 450,225 390,140 300,140 Z" fill="url(#suitGrad)"/>

  <!-- Web Pattern on Mask -->
  <!-- Center Spoke lines -->
  <g stroke="#18040C" stroke-width="2.5" opacity="0.85">
    <line x1="300" y1="365" x2="300" y2="140"/>
    <line x1="300" y1="365" x2="210" y2="160"/>
    <line x1="300" y1="365" x2="165" y2="240"/>
    <line x1="300" y1="365" x2="150" y2="350"/>
    <line x1="300" y1="365" x2="175" y2="470"/>
    <line x1="300" y1="365" x2="230" y2="565"/>
    <line x1="300" y1="365" x2="300" y2="620"/>
    <line x1="300" y1="365" x2="370" y2="565"/>
    <line x1="300" y1="365" x2="425" y2="470"/>
    <line x1="300" y1="365" x2="450" y2="350"/>
    <line x1="300" y1="365" x2="435" y2="240"/>
    <line x1="300" y1="365" x2="390" y2="160"/>

    <!-- Arcs between spokes -->
    <path d="M 270,300 Q 300,285 330,300" fill="none"/>
    <path d="M 240,240 Q 300,215 360,240" fill="none"/>
    <path d="M 210,180 Q 300,150 390,180" fill="none"/>
  </g>

  <!-- SPIDER-MAN ICONIC WHITE REFLECTIVE EYES -->
  <!-- Left Eye -->
  <!-- Black Bezel -->
  <path d="M 180,310 C 205,335 255,395 285,405 C 280,380 270,300 190,265 C 180,260 170,290 180,310 Z" fill="#080811" stroke="#FF3D6E" stroke-width="3" filter="url(#neonBloom)"/>
  <!-- White Inner Lens -->
  <path d="M 192,305 C 212,328 250,380 275,390 C 270,368 260,305 200,277 C 190,273 186,290 192,305 Z" fill="url(#eyeGlow)"/>

  <!-- Right Eye -->
  <!-- Black Bezel -->
  <path d="M 420,310 C 395,335 345,395 315,405 C 320,380 330,300 410,265 C 420,260 430,290 420,310 Z" fill="#080811" stroke="#33E6C9" stroke-width="3" filter="url(#neonBloom)"/>
  <!-- White Inner Lens -->
  <path d="M 408,305 C 388,328 350,380 325,390 C 330,368 340,305 400,277 C 410,273 414,290 408,305 Z" fill="url(#eyeGlow)"/>

  <!-- Spider Chest Sigil at Bottom -->
  <g transform="translate(300, 680) scale(1.1)">
    <path d="M 0,-30 L 12, -8 L 8, 18 L 0, 32 L -8, 18 L -12, -8 Z" fill="#FFFFFF" filter="url(#neonBloom)"/>
    <!-- Top Legs -->
    <path d="M 8,-18 Q 45,-45 75,-25 L 85,-10 L 60, -20 Q 30, -30 8, -8" fill="#FFFFFF"/>
    <path d="M -8,-18 Q -45,-45 -75,-25 L -85,-10 L -60, -20 Q -30, -30 -8, -8" fill="#FFFFFF"/>
    <!-- Bottom Legs -->
    <path d="M 8,5 Q 50,0 80,45 L 82,65 L 68, 45 Q 40, 15 8, 18" fill="#FFFFFF"/>
    <path d="M -8,5 Q -50,0 -80,45 L -82,65 L -68, 45 Q -40, 15 -8, 18" fill="#FFFFFF"/>
  </g>

  <!-- Multiverse Tag & Tech HUD overlay -->
  <text x="40" y="70" fill="#33E6C9" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" letter-spacing="3">UNIVERSE 001 // THE WEB</text>
  <text x="40" y="750" fill="#FFFFFF" font-family="'Chakra Petch', sans-serif" font-size="28" font-weight="700" letter-spacing="2">SPIDER-MAN</text>
  <text x="40" y="775" fill="#8D8DA0" font-family="'JetBrains Mono', monospace" font-size="12" letter-spacing="1">ROLE: WEB ARCHITECT // TECH: HTML·CSS·REACT·APIS</text>
</svg>
