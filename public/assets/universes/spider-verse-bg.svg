<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%">
  <defs>
    <radialGradient id="spg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#2a0845" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#0b0818" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#050508"/>
    </radialGradient>
    <linearGradient id="webLine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3D6E" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#7C5CFF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#33E6C9" stop-opacity="0.5"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#spg)"/>
  <!-- Perspective web matrix -->
  <g stroke="url(#webLine)" stroke-width="1.5" fill="none">
    <line x1="600" y1="400" x2="0" y2="0"/>
    <line x1="600" y1="400" x2="300" y2="0"/>
    <line x1="600" y1="400" x2="600" y2="0"/>
    <line x1="600" y1="400" x2="900" y2="0"/>
    <line x1="600" y1="400" x2="1200" y2="0"/>
    <line x1="600" y1="400" x2="1200" y2="400"/>
    <line x1="600" y1="400" x2="1200" y2="800"/>
    <line x1="600" y1="400" x2="900" y2="800"/>
    <line x1="600" y1="400" x2="600" y2="800"/>
    <line x1="600" y1="400" x2="300" y2="800"/>
    <line x1="600" y1="400" x2="0" y2="800"/>
    <line x1="600" y1="400" x2="0" y2="400"/>
    <!-- Web rings -->
    <ellipse cx="600" cy="400" rx="150" ry="100"/>
    <ellipse cx="600" cy="400" rx="320" ry="210"/>
    <ellipse cx="600" cy="400" rx="520" ry="340"/>
    <ellipse cx="600" cy="400" rx="720" ry="470"/>
  </g>
</svg>
